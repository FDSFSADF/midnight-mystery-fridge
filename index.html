<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深夜宵夜 1 到 10 號盲盒命運抽獎器</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

    <!-- 頂部標題區 -->
    <header class="w-full max-w-2xl flex items-center justify-between bg-slate-800/80 border border-slate-700 rounded-2xl p-4 shadow-lg mb-6">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">🍜</span>
            <h1 class="text-xl md:text-2xl font-black text-yellow-400">
                深夜宵夜 1 到 10 號盲盒命運抽獎器
            </h1>
        </div>
        <div class="text-xs font-semibold text-yellow-300 bg-slate-900/60 px-3 py-1 rounded-full border border-yellow-500/30">
            Ready 🚀
        </div>
    </header>

    <!-- 主體內容區 -->
    <main class="w-full max-w-2xl flex flex-col gap-6 flex-grow">
        
        <!-- 抽獎操作區 -->
        <div class="bg-slate-800/60 border border-slate-700 rounded-3xl p-6 text-center shadow-xl">
            <p class="text-sm text-slate-300 mb-4">半夜肚子餓不知道吃什麼？讓命運盲盒來決定今晚的救贖美食！</p>
            <button onclick="randomDraw()" class="px-8 py-4 bg-gradient-to-r from-pink-500 to-yellow-500 text-slate-950 font-black text-lg rounded-2xl shadow-lg hover:opacity-90 active:scale-95 transition-all cursor-pointer">
                🎲 一鍵隨機抽取深夜盲盒
            </button>
        </div>

        <!-- 1到10號碼盲盒選擇區 -->
        <div class="bg-slate-800/60 border border-slate-700 rounded-3xl p-6 shadow-xl">
            <h2 class="text-xs font-bold text-slate-400 mb-3 text-center">🔢 1 到 10 號美食盲盒（點擊可直接手動開箱）</h2>
            <div class="grid grid-cols-5 gap-3">
                <button onclick="selectBox(1)" class="py-3 bg-slate-900 border border-slate-700 rounded-xl font-bold text-slate-200 hover:bg-pink-600 hover:border-pink-500 transition-all cursor-pointer">盲盒 1</button>
                <button onclick="selectBox(2)" class="py-3 bg-slate-900 border border-slate-700 rounded-xl font-bold text-slate-200 hover:bg-pink-600 hover:border-pink-500 transition-all cursor-pointer">盲盒 2</button>
                <button onclick="selectBox(3)" class="py-3 bg-slate-900 border border-slate-700 rounded-xl font-bold text-slate-200 hover:bg-pink-600 hover:border-pink-500 transition-all cursor-pointer">盲盒 3</button>
                <button onclick="selectBox(4)" class="py-3 bg-slate-900 border border-slate-700 rounded-xl font-bold text-slate-200 hover:bg-pink-600 hover:border-pink-500 transition-all cursor-pointer">盲盒 4</button>
                <button onclick="selectBox(5)" class="py-3 bg-slate-900 border border-slate-700 rounded-xl font-bold text-slate-200 hover:bg-pink-600 hover:border-pink-500 transition-all cursor-pointer">盲盒 5</button>
                <button onclick="selectBox(6)" class="py-3 bg-slate-900 border border-slate-700 rounded-xl font-bold text-slate-200 hover:bg-pink-600 hover:border-pink-500 transition-all cursor-pointer">盲盒 6</button>
                <button onclick="selectBox(7)" class="py-3 bg-slate-900 border border-slate-700 rounded-xl font-bold text-slate-200 hover:bg-pink-600 hover:border-pink-500 transition-all cursor-pointer">盲盒 7</button>
                <button onclick="selectBox(8)" class="py-3 bg-slate-900 border border-slate-700 rounded-xl font-bold text-slate-200 hover:bg-pink-600 hover:border-pink-500 transition-all cursor-pointer">盲盒 8</button>
                <button onclick="selectBox(9)" class="py-3 bg-slate-900 border border-slate-700 rounded-xl font-bold text-slate-200 hover:bg-pink-600 hover:border-pink-500 transition-all cursor-pointer">盲盒 9</button>
                <button onclick="selectBox(10)" class="py-3 bg-slate-900 border border-slate-700 rounded-xl font-bold text-slate-200 hover:bg-pink-600 hover:border-pink-500 transition-all cursor-pointer">盲盒 10</button>
            </div>
        </div>

        <!-- 結果顯示看板 -->
        <div class="bg-slate-900/80 border border-slate-700 rounded-2xl p-5 text-center shadow-inner space-y-2">
            <div class="text-xs text-slate-400">當前盲盒開箱結果</div>
            <div id="result-name" class="text-2xl font-black text-yellow-400">尚未開箱</div>
            <div id="result-details" class="text-sm text-slate-300">點擊上方按鈕或數字盲盒來揭曉今晚宵夜！</div>
        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="w-full text-center text-xs text-slate-500 mt-8">
        © 2026 深夜宵夜盲盒命運抽獎器 | Vibe Coding 專案
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        // 10 大深夜宵夜資料庫
        const foodDatabase = {
            1: { name: "🔥 鹹酥雞加九層塔", calories: "650 大卡", comment: "炸物之王，罪惡但靈魂獲得徹底救贖！" },
            2: { name: "🍜 日式濃厚豚骨拉麵", calories: "800 大卡", comment: "濃郁湯頭搭配叉燒，深夜最奢侈的享受。" },
            3: { name: "🥟 爆漿小籠包", calories: "550 大卡", comment: "一口咬下湯汁四溢，小心燙口！" },
            4: { name: "🍥 經典肉醬泡麵加蛋", calories: "450 大卡", comment: "深夜最省錢、最經典的靈魂好夥伴。" },
            5: { name: "🥟 深夜水餃 10 顆", calories: "500 大卡", comment: "煮水餃最快速，沾上醬油醋完美收尾。" },
            6: { name: "🍗 香酥大雞排", calories: "700 大卡", comment: "老闆切不要辣！快樂直接翻倍。" },
            7: { name: "🍲 加熱滷味冬粉", calories: "350 大卡", comment: "吸滿沙茶醬汁的冬粉，罪惡感稍微低一點點。" },
            8: { name: "🍢 炭烤香雞串", calories: "400 大卡", comment: "串燒香氣撲鼻，配上一杯冰涼飲料剛剛好。" },
            9: { name: "🍳 黃金蛋炒飯", calories: "600 大卡", comment: "粒粒分明的隔夜飯救贖，香氣四溢！" },
            10: { name: "🥪 熱壓起司吐司", calories: "450 大卡", comment: "牽絲起司搭配酥脆吐司，深夜的小確幸。" }
        };

        // 手動點擊號碼開箱
        function selectBox(num) {
            const food = foodDatabase[num];
            document.getElementById('result-name').innerText = food.name;
            document.getElementById('result-details').innerHTML = `
                <p>🔥 預估熱量：<span class="text-pink-400 font-bold">${food.calories}</span></p>
                <p class="text-slate-400 mt-1">💬 ${food.comment}</p>
            `;
        }

        // 隨機抽出一個號碼開箱
        function randomDraw() {
            const luckyNum = Math.floor(Math.random() * 10) + 1;
            selectBox(luckyNum);
        }
    </script>
</body>
</html>
